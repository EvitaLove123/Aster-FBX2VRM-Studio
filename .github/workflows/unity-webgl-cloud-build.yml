name: Unity WebGL Cloud Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "unity/AsterVrmExporter/**"
      - ".github/workflows/unity-webgl-cloud-build.yml"

permissions:
  contents: read

concurrency:
  group: aster-unity-webgl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build UniVRM WebGL module
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          missing=0
          for name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing GitHub secret::$name is required for the configured GameCI Personal-license flow."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "See unity/README.md for the Android-accessible activation workflow and secret setup."
            exit 1
          fi

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: unity/AsterVrmExporter/Library
          key: UnityLibrary-WebGL-2022.3.62f1-${{ hashFiles('unity/AsterVrmExporter/Assets/**', 'unity/AsterVrmExporter/Packages/**', 'unity/AsterVrmExporter/ProjectSettings/**') }}
          restore-keys: |
            UnityLibrary-WebGL-2022.3.62f1-

      - name: Build WebGL with GameCI
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/AsterVrmExporter
          unityVersion: 2022.3.62f1
          targetPlatform: WebGL
          buildsPath: build
          buildMethod: AsterVrmExporter.Editor.AsterCloudBuild.BuildWebGL
          manualExit: true

      - name: Upload WebGL build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aster-unity-webgl
          path: build/WebGL
          if-no-files-found: error
          retention-days: 7
