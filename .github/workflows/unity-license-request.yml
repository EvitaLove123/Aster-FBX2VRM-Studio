name: Request Unity Activation File

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request:
    name: Generate Unity manual activation request
    runs-on: ubuntu-latest
    steps:
      - name: Request activation file for the pinned Unity version
        id: request
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 2022.3.62f1

      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-request-2022.3.62f1
          path: ${{ steps.request.outputs.filePath }}
          if-no-files-found: error
          retention-days: 3
